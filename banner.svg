<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Janelle Ranario. Pretty software is easy. Effective software is harder. 100K+ in sales driven. Open for work.">

  <defs>
    <linearGradient id="pinkCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF9ACF"/>
      <stop offset="55%"  stop-color="#FF6FB5"/>
      <stop offset="100%" stop-color="#F14C9B"/>
    </linearGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF6FB5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF6FB5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLime" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A8E85C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A8E85C" stop-opacity="0"/>
    </radialGradient>

    <path id="sp" d="M0,-18 C3,-6 6,-3 18,0 C6,3 3,6 0,18 C-3,6 -6,3 -18,0 C-6,-3 -3,-6 0,-18 Z"/>
  </defs>

  <rect width="1000" height="230" rx="20" fill="#0A0A0A"/>
  <rect width="1000" height="230" rx="20" fill="none" stroke="#1E1E1E" stroke-width="1"/>

  <circle cx="840" cy="50"  r="210" fill="url(#glowPink)"/>
  <circle cx="60"  cy="215" r="170" fill="url(#glowLime)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

    <!-- ── left  who and what ─────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.05s" fill="freeze"/>
      <rect x="48" y="30" width="240" height="30" rx="15" fill="#141414" stroke="#2A2A2A"/>
      <text x="68" y="50" font-size="12.5" font-weight="600" letter-spacing="0.4" fill="#C9C9C9">Janelle Ranario · CS @ UP Cebu</text>
    </g>

    <g font-weight="700" letter-spacing="-1.4">
      <text x="48" y="110" font-size="34" fill="#FF6FB5" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0.2s" fill="freeze"/>
        Pretty software is easy.
      </text>
      <text x="48" y="150" font-size="34" fill="#A8E85C" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0.35s" fill="freeze"/>
        Effective software is harder.
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
      <rect x="48" y="188" width="3" height="20" fill="#A8E85C"/>
      <text x="64" y="203" font-size="12" font-weight="600" letter-spacing="0.3" fill="#B5B5B5">Open for work · Freelance &amp; internships</text>
    </g>

    <!-- ── right  the hook ────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0.45s" fill="freeze"/>

      <rect x="636" y="36" width="316" height="158" rx="18" fill="url(#pinkCard)"/>

      <text x="668" y="76" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#0A0A0A" opacity="0.55">ORGANIC REACH</text>
      <text x="666" y="134" font-size="50" font-weight="700" letter-spacing="-2" fill="#0A0A0A">100K+</text>
      <text x="668" y="162" font-size="12.5" font-weight="600" fill="#0A0A0A" opacity="0.78">converted to sales</text>

      <g transform="translate(952,30)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
          <polygon fill="#F4E04D" points="
            30,0 12.6,3.38 25.98,15 9.22,9.22 15,25.98 3.38,12.6 0,30 -3.38,12.6
            -15,25.98 -9.22,9.22 -25.98,15 -12.6,3.38 -30,0 -12.6,-3.38 -25.98,-15
            -9.22,-9.22 -15,-25.98 -3.38,-12.6 0,-30 3.38,-12.6 15,-25.98 9.22,-9.22
            25.98,-15 12.6,-3.38"/>
        </g>
      </g>
    </g>

    <!-- ── restrained decoration ───────────────────── -->
    <g transform="translate(606,46) scale(0.5)" fill="#A8E85C">
      <use href="#sp"/>
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.4s" repeatCount="indefinite"/>
    </g>
    <circle cx="600" cy="152" r="6" fill="#C9B8F5"/>

  </g>
</svg>
