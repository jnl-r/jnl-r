<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="How I work, 100K+ in sales driven from one TikTok video, open for work">

  <defs>
    <linearGradient id="pinkCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF9ACF"/>
      <stop offset="55%"  stop-color="#FF6FB5"/>
      <stop offset="100%" stop-color="#F14C9B"/>
    </linearGradient>

    <path id="sp" d="M0,-18 C3,-6 6,-3 18,0 C6,3 3,6 0,18 C-3,6 -6,3 -18,0 C-6,-3 -3,-6 0,-18 Z"/>
  </defs>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

    <!-- ── CARD 1 · how I work ─────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.05s" fill="freeze"/>

      <rect x="0" y="0" width="296" height="210" rx="22" fill="#131313" stroke="#242424"/>

      <text x="28" y="46" font-size="11" font-weight="700" letter-spacing="2.4" fill="#7A7A7A">HOW I WORK</text>

      <circle cx="50"  cy="112" r="22" fill="#A8E85C"/>
      <circle cx="115" cy="112" r="22" fill="#FF6FB5"/>
      <circle cx="181" cy="112" r="22" fill="#F4E04D"/>
      <circle cx="246" cy="112" r="22" fill="#C9B8F5"/>

      <g fill="#0A0A0A" font-size="15" font-weight="700" text-anchor="middle">
        <text x="50"  y="118">D</text>
        <text x="115" y="118">B</text>
        <text x="181" y="118">S</text>
        <text x="246" y="118">M</text>
      </g>

      <g fill="#9A9A9A" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="0.3">
        <text x="50"  y="160">Design</text>
        <text x="115" y="160">Build</text>
        <text x="181" y="160">Ship</text>
        <text x="246" y="160">Measure</text>
      </g>
    </g>

    <!-- ── CARD 2 · the number ─────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>

      <rect x="320" y="0" width="356" height="210" rx="22" fill="url(#pinkCard)"/>

      <g transform="translate(636,38) scale(0.36)" fill="#FFFFFF" opacity="0.85">
        <use href="#sp"/>
        <animate attributeName="opacity" values="0.85;0.25;0.85" dur="3.2s" repeatCount="indefinite"/>
      </g>

      <circle cx="368" cy="54" r="25" fill="#FFFFFF"/>
      <g stroke="#0A0A0A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M362,52 L368,45 L374,52"/>
        <path d="M362,60 L368,67 L374,60"/>
      </g>

      <text x="410" y="62" font-size="13" font-weight="600" fill="#0A0A0A" opacity="0.6">Sales driven</text>

      <text x="368" y="152" font-size="66" font-weight="700" letter-spacing="-3" fill="#0A0A0A">100K+</text>

      <text x="368" y="182" font-size="13.5" font-weight="600" fill="#0A0A0A" opacity="0.65">
        from a single TikTok video
      </text>
    </g>

    <!-- ── CARD 3 · status ─────────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/>

      <rect x="700" y="0" width="300" height="210" rx="22" fill="#131313" stroke="#242424"/>

      <circle cx="732" cy="42" r="14" fill="#A8E85C" opacity="0.12">
        <animate attributeName="r" values="8;16;8" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.22;0;0.22" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="732" cy="42" r="5.5" fill="#A8E85C"/>

      <text x="750" y="47" font-size="11" font-weight="700" letter-spacing="2.4" fill="#7A7A7A">STATUS</text>

      <text x="728" y="118" font-size="27" font-weight="700" letter-spacing="-0.8" fill="#FFFFFF">Open for work</text>

      <text x="728" y="150" font-size="13" font-weight="500" fill="#8A8A8A">Freelance · Internships · Cebu, PH</text>

      <rect x="728" y="170" width="88" height="3" rx="1.5" fill="#FF6FB5"/>
      <rect x="822" y="170" width="44" height="3" rx="1.5" fill="#A8E85C"/>
      <rect x="872" y="170" width="22" height="3" rx="1.5" fill="#F4E04D"/>
    </g>

  </g>
</svg>
