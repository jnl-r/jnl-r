<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="100K+ in sales driven from a single TikTok video. Open for work.">

  <defs>
    <linearGradient id="pinkCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF9ACF"/>
      <stop offset="55%"  stop-color="#FF6FB5"/>
      <stop offset="100%" stop-color="#F14C9B"/>
    </linearGradient>
    <path id="sp" d="M0,-18 C3,-6 6,-3 18,0 C6,3 3,6 0,18 C-3,6 -6,3 -18,0 C-6,-3 -3,-6 0,-18 Z"/>
  </defs>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

    <!-- ── the number ─────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.05s" fill="freeze"/>

      <rect x="0" y="0" width="584" height="150" rx="20" fill="url(#pinkCard)"/>

      <g transform="translate(542,32) scale(0.34)" fill="#FFFFFF" opacity="0.85">
        <use href="#sp"/>
        <animate attributeName="opacity" values="0.85;0.25;0.85" dur="3.2s" repeatCount="indefinite"/>
      </g>

      <text x="36" y="98" font-size="58" font-weight="700" letter-spacing="-2.5" fill="#0A0A0A">100K+</text>

      <text x="248" y="70" font-size="11" font-weight="700" letter-spacing="2.2" fill="#0A0A0A" opacity="0.55">SALES DRIVEN</text>
      <text x="248" y="95" font-size="15" font-weight="600" fill="#0A0A0A" opacity="0.82">from a single TikTok video</text>
    </g>

    <!-- ── status ─────────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>

      <rect x="608" y="0" width="392" height="150" rx="20" fill="#131313" stroke="#242424"/>

      <circle cx="640" cy="42" r="14" fill="#A8E85C" opacity="0.12">
        <animate attributeName="r" values="8;16;8" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.22;0;0.22" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="42" r="5.5" fill="#A8E85C"/>

      <text x="658" y="47" font-size="11" font-weight="700" letter-spacing="2.2" fill="#7A7A7A">STATUS</text>

      <text x="636" y="97" font-size="25" font-weight="700" letter-spacing="-0.7" fill="#FFFFFF">Open for work</text>
      <text x="636" y="124" font-size="12.5" font-weight="500" fill="#8A8A8A">Freelance · Internships · Cebu, PH</text>
    </g>

  </g>
</svg>
