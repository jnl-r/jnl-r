<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Janelle Ranario — Software with taste, built for women first">

  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#A8E85C"/>
      <stop offset="100%" stop-color="#FF6FB5"/>
    </linearGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF6FB5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF6FB5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLime" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A8E85C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#A8E85C" stop-opacity="0"/>
    </radialGradient>

    <path id="spark" d="M0,-18 C3,-6 6,-3 18,0 C6,3 3,6 0,18 C-3,6 -6,3 -18,0 C-6,-3 -3,-6 0,-18 Z"/>
  </defs>

  <rect width="1000" height="340" rx="20" fill="#0A0A0A"/>
  <rect width="1000" height="340" rx="20" fill="none" stroke="#1E1E1E" stroke-width="1"/>

  <circle cx="880" cy="90"  r="230" fill="url(#glowPink)"/>
  <circle cx="90"  cy="270" r="200" fill="url(#glowLime)"/>

  <g stroke="#242424" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M18,118 C60,96 104,88 150,92"/>
    <path d="M14,134 C58,110 108,101 158,106"/>
    <path d="M20,150 C62,128 110,118 154,123"/>
  </g>

  <g transform="translate(892,74)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="26s" repeatCount="indefinite"/>
      <polygon fill="#F4E04D" points="
        46,0 19.32,5.18 39.84,23 14.14,14.14 23,39.84 5.18,19.32 0,46 -5.18,19.32
        -23,39.84 -14.14,14.14 -39.84,23 -19.32,5.18 -46,0 -19.32,-5.18 -39.84,-23
        -14.14,-14.14 -23,-39.84 -5.18,-19.32 0,-46 5.18,-19.32 23,-39.84 14.14,-14.14
        39.84,-23 19.32,-5.18"/>
    </g>
  </g>

  <g transform="translate(120,92)" fill="#A8E85C">
    <use href="#spark"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(786,300) scale(0.5)" fill="#FFFFFF">
    <use href="#spark"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(596,52) scale(0.42)" fill="#A8E85C">
    <use href="#spark"/>
    <animate attributeName="opacity" values="0.8;0.15;0.8" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(946,262)" stroke="#FF6FB5" stroke-width="7" stroke-linecap="round">
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="-19" y1="-11" x2="19" y2="11"/>
    <line x1="-19" y1="11"  x2="19" y2="-11"/>
  </g>

  <circle cx="770" cy="46"  r="8" fill="#C9B8F5"/>
  <circle cx="44"  cy="238" r="5" fill="#FF6FB5"/>
  <circle cx="962" cy="160" r="11" fill="#FF6FB5" opacity="0.35"/>

  <!-- eyebrow pill -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
    <rect x="70" y="46" width="272" height="34" rx="17" fill="#141414" stroke="#2A2A2A"/>
    <circle cx="92" cy="63" r="4.5" fill="#A8E85C"/>
    <text x="106" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600" letter-spacing="0.6" fill="#C9C9C9">
      Janelle Ranario · CS @ UP Cebu
    </text>
  </g>

  <!-- headline -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="-2">
    <text x="70" y="168" font-size="60" fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.25s" fill="freeze"/>
      Software with <tspan fill="#FF6FB5">taste</tspan>,
    </text>
    <text x="70" y="234" font-size="60" fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
      built for <tspan fill="#A8E85C">women</tspan> first.
    </text>
  </g>

  <rect x="70" y="258" width="0" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" from="0" to="132" dur="0.7s" begin="0.7s" fill="freeze"/>
  </rect>

  <text x="70" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15.5" font-weight="500" letter-spacing="0.2" fill="#8A8A8A" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.85s" fill="freeze"/>
    Full-stack developer · Product for the public · Websites that convert
  </text>

</svg>
